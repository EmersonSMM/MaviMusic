name: Check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-linux:
    name: Desktop · Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - name: Linux native runtime and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential libasound2 libasound2-plugins libva2 libva-drm2 libvdpau1 libgl1 libpulse0 xvfb

      - run: chmod +x gradlew

      - name: Tests
        run: xvfb-run --auto-servernum ./gradlew :shared:jvmTest :desktopUi:jvmTest :desktopApp:test

      - name: Build the distributable
        run: ./gradlew :desktopApp:createDistributable

      - name: The analyser is in the jar
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/MaviMusic/lib/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'native/libmavimusic_analysis.so'
          jar tf "$jar" | grep -q 'models/.*\.onnx'

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-test-reports
          path: |
            desktopApp/build/reports/tests/
            shared/build/reports/tests/

  desktop-windows:
    name: Desktop · Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        shell: bash
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - name: CMake version
        run: cmake --version

      - name: Tests
        run: .\gradlew.bat :shared:jvmTest :desktopUi:jvmTest :desktopApp:test

      - name: Parse Windows updater helper
        shell: pwsh
        run: |
          $parseTokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$pwd/desktopApp/src/main/resources/updates/windows-update.ps1", [ref]$parseTokens, [ref]$parseErrors)
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }

      - name: Windows native window smoke test
        run: .\gradlew.bat :desktopApp:windowsWindowSmoke

      - name: WiX for transactional MSI validation
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip -OutFile "$env:RUNNER_TEMP/wix.zip"
          Expand-Archive "$env:RUNNER_TEMP/wix.zip" "$env:RUNNER_TEMP/wix" -Force
          "$env:RUNNER_TEMP/wix" | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build MSI and verify rollback transaction
        run: .\gradlew.bat :desktopApp:packageMsi

      - name: Build the distributable
        run: .\gradlew.bat :desktopApp:createDistributable

      - name: The analyser is in the jar
        shell: bash
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/MaviMusic/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'native/mavimusic_analysis.dll'
          jar tf "$jar" | grep -q 'models/.*\.onnx'
          # WinRT, so only MSVC can build it and only this job ever does.
          jar tf "$jar" | grep -q 'native/mavimusic_smtc.dll'

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-test-reports
          path: |
            desktopApp/build/reports/tests/
            shared/build/reports/tests/

  desktop-macos:
    name: Desktop · macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - run: chmod +x gradlew

      - name: Tests
        run: ./gradlew :shared:jvmTest :desktopUi:jvmTest :desktopApp:test

      - name: Build the distributable
        run: ./gradlew :desktopApp:createDistributable

      - name: Verify signed-update tooling with temporary test keys
        env:
          SPARKLE_SIGNER: ${{ github.workspace }}/desktopApp/build/sparkle/bin/sign_update
        run: python3 -m unittest discover -s scripts/updates -p 'test_*.py' -v

      - name: The analyser and models are in the jar
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/MaviMusic.app/Contents/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'models/.*\.onnx'
          jar tf "$jar" | grep -q 'native/libmavimusic_analysis.dylib'
          jar tf "$jar" | grep -q 'native/libmavimusic_mac_media.dylib'

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-test-reports
          path: |
            desktopApp/build/reports/tests/
            shared/build/reports/tests/

  backend:
    name: Backend · Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
