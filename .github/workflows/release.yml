name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the packages, without the leading v"
        required: true
      intel:
        description: "Include macOS Intel in internal builds (always included when publishing)"
        type: boolean
        required: false
        default: false
      publish:
        description: "Publish publicly and activate updates (leave off for internal testing)"
        type: boolean
        required: false
        default: false

env:
  REQUESTED_VERSION: ${{ inputs.version }}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows · MSI (EXE only for publishing)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: WiX Toolset 3
        shell: pwsh
        run: |
          $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          Invoke-WebRequest -Uri $url -OutFile wix.zip
          Expand-Archive wix.zip -DestinationPath "$env:RUNNER_TEMP\wix"
          "$env:RUNNER_TEMP\wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: CMake version
        run: cmake --version

      - name: Work out the version
        id: version
        shell: bash
        run: |
          version="${REQUESTED_VERSION}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Use a stable MAJOR.MINOR.PATCH version"; exit 1; }
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Write local.properties
        shell: bash
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - name: Tests
        run: .\gradlew.bat :shared:jvmTest :desktopUi:jvmTest :desktopApp:test "-Pmavimusic.version=${{ steps.version.outputs.value }}"

      - name: Parse Windows updater helper
        shell: pwsh
        run: |
          $parseTokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$pwd/desktopApp/src/main/resources/updates/windows-update.ps1", [ref]$parseTokens, [ref]$parseErrors)
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }

      - name: Windows native window smoke test
        run: .\gradlew.bat :desktopApp:windowsWindowSmoke

      - name: Preserve failing test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-tests-windows
          path: |
            desktopApp/build/reports/tests/
            desktopApp/build/test-results/
            desktopUi/build/reports/tests/
            shared/build/reports/tests/

      - name: Build MSI installer
        run: |
          .\gradlew.bat :desktopApp:packageMsi :desktopApp:createDistributable "-Pmavimusic.version=${{ steps.version.outputs.value }}"

      - name: Build installer for legacy Windows update clients
        if: ${{ inputs.publish == true }}
        run: .\gradlew.bat :desktopApp:packageExe "-Pmavimusic.version=${{ steps.version.outputs.value }}"

      - name: The analyser and models are in the jar
        shell: bash
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/MaviMusic/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'native/mavimusic_analysis.dll'
          jar tf "$jar" | grep -q 'models/.*\.onnx'
          # WinRT, so only MSVC can build it and only this job ever does.
          jar tf "$jar" | grep -q 'native/mavimusic_smtc.dll'

      - name: Collect
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.value }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item desktopApp/build/compose/binaries/main/msi/*.msi "dist/MaviMusic-$v-windows-x64.msi"
          if ("${{ inputs.publish }}" -eq "true") {
            Copy-Item desktopApp/build/compose/binaries/main/exe/*.exe "dist/MaviMusic-$v-windows-x64-setup.exe"
          }
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*

  macos:
    name: macOS · DMG (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((inputs.publish || inputs.intel) && '[{"os":"macos-14","arch":"arm64"},{"os":"macos-15-intel","arch":"x64"}]' || '[{"os":"macos-14","arch":"arm64"}]') }}
    runs-on: ${{ matrix.os }}
    env:
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        run: |
          version="${REQUESTED_VERSION}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Use a stable MAJOR.MINOR.PATCH version"; exit 1; }
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - run: chmod +x gradlew

      - name: Tests
        run: ./gradlew :shared:jvmTest :desktopUi:jvmTest :desktopApp:test -Pmavimusic.version=${{ steps.version.outputs.value }}

      - name: Preserve failing test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-tests-macos-${{ matrix.arch }}
          path: |
            desktopApp/build/reports/tests/
            desktopApp/build/test-results/
            desktopUi/build/reports/tests/
            shared/build/reports/tests/

      - name: Validate update signing key and changelog
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          python3 - <<'PYTHON'
          import base64, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/updates')
          from create_signing_key import public_key
          from publish_appcast import release_notes
          secret = os.environ.get('SPARKLE_PRIVATE_KEY', '').strip()
          if not secret:
              raise SystemExit('Configure the SPARKLE_PRIVATE_KEY Actions secret before publishing updates')
          config = json.loads(Path('desktopApp/packaging/updates/channel.json').read_text())
          assert public_key(base64.b64decode(secret, validate=True)) == config['publicKey'], 'Signing key mismatch'
          release_notes('CHANGELOG.md', os.environ['RELEASE_VERSION'])
          PYTHON

      - name: Import optional Developer ID certificate into an ephemeral CI keychain
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: python3 scripts/updates/ci_certificate.py import

      - name: Build DMG installer
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          ./gradlew :desktopApp:packageDmg \
            -Pmavimusic.version=${{ steps.version.outputs.value }}

      - name: The analyser and models are in the jar
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/MaviMusic.app/Contents/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'models/.*\.onnx'
          jar tf "$jar" | grep -q 'native/libmavimusic_analysis.dylib'
          jar tf "$jar" | grep -q 'native/libmavimusic_mac_media.dylib'

      - name: Collect
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          v="${{ steps.version.outputs.value }}"
          arch="${{ matrix.arch }}"
          mkdir -p dist
          for f in desktopApp/build/compose/binaries/main/dmg/*.dmg; do
            [ -f "$f" ] && cp "$f" "dist/MaviMusic-$v-macos-$arch.dmg"
          done
          python3 scripts/updates/publish_appcast.py \
            --archive "dist/MaviMusic-$v-macos-$arch.dmg" --version "$v" --arch "$arch" \
            --output "dist/appcast-$arch.xml" --signer desktopApp/build/sparkle/bin/sign_update
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-artifacts
          path: dist/*

      - name: Remove temporary signing credentials
        if: always()
        run: python3 scripts/updates/ci_certificate.py cleanup

  release:
    if: ${{ inputs.publish == true }}
    permissions:
      contents: write
    name: Publish
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-artifacts"
          merge-multiple: true
          path: dist

      - run: ls -lh dist

      - name: Prepare release notes
        id: version
        run: |
          version="${REQUESTED_VERSION}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "value=$version" >> "$GITHUB_OUTPUT"
          python3 - "$version" <<'PYTHON' > release-notes.md
          import sys
          sys.path.insert(0, 'scripts/updates')
          from publish_appcast import release_notes
          print(release_notes('CHANGELOG.md', sys.argv[1]))
          PYTHON
          test -s dist/appcast-arm64.xml
          test -s dist/appcast-x64.xml
          (cd dist && shasum -a 256 * > SHA256SUMS)

      - name: Upload, verify and publish the complete draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          python3 scripts/updates/publish_release.py \
            --directory dist --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" --notes release-notes.md
