<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaviMusic WebKit Audio Bridge</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }
        #player-container {
            width: 1px;
            height: 1px;
            opacity: 0.01;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="player-container">
        <div id="yt-player"></div>
    </div>

    <script>
        var player = null;
        var progressTimer = null;
        var isPlayerReady = false;
        var pendingVideoId = null;

        function postToSwift(type, payload) {
            try {
                if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.playerBridge) {
                    var msg = { type: type };
                    if (payload) {
                        for (var key in payload) {
                            if (payload.hasOwnProperty(key)) {
                                msg[key] = payload[key];
                            }
                        }
                    }
                    window.webkit.messageHandlers.playerBridge.postMessage(msg);
                }
            } catch (err) {
                console.error("Bridge send error:", err);
            }
        }

        // Load YouTube Iframe API asynchronously
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                height: '100',
                width: '100',
                videoId: '',
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'disablekb': 1,
                    'fs': 0,
                    'modestbranding': 1,
                    'rel': 0,
                    'playsinline': 1,
                    'origin': 'https://music.youtube.com'
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerReady(event) {
            isPlayerReady = true;
            postToSwift('ready', { message: 'YouTube IFrame Engine Ready' });
            if (pendingVideoId) {
                var vid = pendingVideoId;
                pendingVideoId = null;
                loadTrack(vid);
            }
        }

        function onPlayerStateChange(event) {
            // YT.PlayerState:
            // -1: unstarted, 0: ended, 1: playing, 2: paused, 3: buffering, 5: video cued
            var state = event.data;
            if (state === 1) { // PLAYING
                startProgressTimer();
            } else if (state === 0) { // ENDED
                stopProgressTimer();
                // Send final tick at 100%
                sendProgress();
            } else if (state === 2) { // PAUSED
                stopProgressTimer();
                sendProgress();
            }
            postToSwift('stateChange', { state: state });
        }

        function onPlayerError(event) {
            postToSwift('error', { code: event.data });
        }

        function startProgressTimer() {
            stopProgressTimer();
            progressTimer = setInterval(sendProgress, 250);
        }

        function stopProgressTimer() {
            if (progressTimer) {
                clearInterval(progressTimer);
                progressTimer = null;
            }
        }

        function sendProgress() {
            if (player && typeof player.getCurrentTime === 'function') {
                var current = player.getCurrentTime() || 0;
                var duration = player.getDuration() || 0;
                postToSwift('timeUpdate', {
                    currentTime: current,
                    duration: duration
                });
            }
        }

        // Methods invoked directly by Swift via evaluateJavaScript
        function loadTrack(videoId) {
            if (!isPlayerReady || !player || typeof player.loadVideoById !== 'function') {
                pendingVideoId = videoId;
                return;
            }
            player.loadVideoById({
                videoId: videoId,
                startSeconds: 0
            });
            player.playVideo();
        }

        function play() {
            if (player && typeof player.playVideo === 'function') {
                player.playVideo();
            }
        }

        function pause() {
            if (player && typeof player.pauseVideo === 'function') {
                player.pauseVideo();
            }
        }

        function seekTo(seconds) {
            if (player && typeof player.seekTo === 'function') {
                player.seekTo(seconds, true);
                sendProgress();
            }
        }

        function setVolume(volume0to100) {
            if (player && typeof player.setVolume === 'function') {
                player.setVolume(volume0to100);
            }
        }
    </script>
</body>
</html>
